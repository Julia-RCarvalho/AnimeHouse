<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonstração Prática de CSS</title>
    
    <!-- Link para conectar o ficheiro CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Título selecionado por ID -->
    <h1 id="titulo-principal">Introdução ao CSS</h1>

    <!-- Cartão selecionado por Classe -->
    <div class="cartao">
        <h2>Cartão de Exemplo</h2>
        <p>Este é um parágrafo simples dentro de um cartão para demonstrar <strong>padding</strong>, <strong>margin</strong> e <strong>border</strong>.</p>
        
        <!-- Botão com efeito :hover -->
        <a href="#" class="botao">Passe o mouse aqui</a>
   
</body>
</html>
